{{define "campaign_card"}}
<a href="/offers/{{.Slug}}" data-tilt="6" class="group relative block overflow-hidden rounded-3xl bg-gradient-to-br from-amber-400 via-orange-500 to-rose-600 text-white shadow-depth-lg">
  {{if .BannerKey}}<img src="{{img .BannerKey}}" alt="" class="absolute inset-0 h-full w-full object-cover opacity-35 mix-blend-overlay transition duration-700 group-hover:scale-110" loading="lazy">{{end}}
  <div class="pointer-events-none absolute -right-16 -top-16 h-56 w-56 rounded-full bg-white/20 blur-2xl transition duration-700 group-hover:scale-125" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -bottom-10 left-1/3 h-40 w-40 rounded-full bg-fuchsia-500/40 blur-3xl" aria-hidden="true"></div>
  <div class="lift relative p-6 sm:p-8">
    <p class="inline-flex rounded-full bg-black/15 px-3 py-1 text-[11px] font-bold uppercase tracking-widest text-white/90 backdrop-blur">Ends {{date .EndsAt}}</p>
    <h3 class="mt-3 text-2xl font-black tracking-tight sm:text-3xl">{{.Title}}</h3>
    <p class="mt-1 text-4xl font-black drop-shadow-[0_4px_12px_rgb(0_0_0/.25)]">{{if eq .DiscountType "percent"}}{{.DiscountValue}}% off{{else}}Save {{money .DiscountValue}}{{end}}</p>
    {{with .Description}}<p class="mt-2 line-clamp-2 max-w-md text-sm text-white/90">{{.}}</p>{{end}}
    <span class="lift-more mt-5 inline-flex items-center gap-1 rounded-full bg-white px-5 py-2 text-sm font-bold text-rose-600 shadow-lg shadow-rose-900/30 transition group-hover:gap-2">Shop the offer <span aria-hidden="true">→</span></span>
  </div>
  <span class="glare"></span>
</a>
{{end}}
