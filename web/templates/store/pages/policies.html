{{define "content"}}
<div class="container-x max-w-3xl py-10">
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Store policies</h1>
  <div class="card mt-6 whitespace-pre-line p-6 text-sm leading-relaxed text-slate-700">{{.Store.Get "policy_text"}}</div>
  <div class="card mt-6 p-6 text-sm text-slate-700">
    <h2 class="font-semibold text-slate-900">Payment</h2>
    <p class="mt-2">We currently accept Cash on Delivery. Please keep the exact amount ready when the courier arrives.</p>
    <h2 class="mt-5 font-semibold text-slate-900">Contact</h2>
    <p class="mt-2">{{.Store.Get "store_phone"}} · {{.Store.Get "store_email"}}</p>
  </div>
</div>
{{end}}
