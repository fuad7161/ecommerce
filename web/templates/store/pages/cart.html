{{define "content"}}
<div class="container-x py-8">
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Shopping cart</h1>
  <div id="cart-summary" class="mt-6" data-include-cart
       hx-post="/cart/summary" hx-vals='{"mode": "cart"}' hx-trigger="load, cart:changed from:body" hx-swap="innerHTML">
    <div class="card p-10 text-center text-sm text-slate-500">Loading your cart…</div>
  </div>
</div>
{{end}}
