{{define "content"}}
<div class="container-x py-8">
  <h1 class="text-2xl font-bold tracking-tight text-slate-900">Offers &amp; campaigns</h1>
  <p class="mt-1 text-sm text-slate-600">Limited-time deals. Discounts are applied automatically at checkout.</p>
  {{if .Offers}}
  <div class="mt-6 grid gap-4 md:grid-cols-2">{{range .Offers}}{{template "campaign_card" .}}{{end}}</div>
  {{else}}
  <div class="card mt-6 p-12 text-center">
    <p class="text-4xl">🎁</p>
    <p class="mt-3 font-semibold text-slate-900">No campaigns are running right now</p>
    <a href="/products?on_sale=1" class="btn-primary mt-4">See discounted products</a>
  </div>
  {{end}}
</div>
{{end}}
