{{define "content"}}
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-brand-600 text-xl font-black text-white">{{firstLetter (.Store.Get "store_name")}}</span>
      <h1 class="mt-3 text-xl font-bold text-slate-900">{{.Store.Get "store_name"}} admin</h1>
      <p class="text-sm text-slate-500">Sign in to manage your store</p>
    </div>
    <form method="post" action="/admin/login" class="card space-y-4 p-6">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      {{with .Error}}<p class="rounded-lg bg-rose-50 p-3 text-sm font-medium text-rose-700" role="alert">{{.}}</p>{{end}}
      <div><label class="label" for="email">Email</label><input id="email" name="email" type="email" value="{{.Email}}" required autofocus autocomplete="username" class="input"></div>
      <div><label class="label" for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" class="input"></div>
      <button class="btn-primary w-full">Sign in</button>
    </form>
  </div>
</div>
{{end}}
