name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web)" || (gofmt -l cmd internal web && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests (unit + PostgreSQL integration, race detector)
        env:
          TEST_DATABASE_URL: postgres://ecommerce:ecommerce@localhost:5432/ecommerce_test?sslmode=disable
        run: go test -count=1 -race -p 1 ./...

  e2e:
    name: Docker build & browser tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          echo "SEED_OFFLINE=true" >> .env
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300 postgres redis && docker compose up -d --build app minio
      - name: Wait for app
        run: timeout 120 sh -c 'until curl -sf localhost:8080/healthz; do sleep 2; done'
      - name: Seed demo data
        run: docker compose run --rm app seed
      - name: Playwright
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
      - name: App logs
        if: failure()
        run: docker compose logs app
